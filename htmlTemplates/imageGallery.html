<html>
    <head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.3.0/dist/photoswipe.css">
        <link rel="stylesheet" href="https://unpkg.com/photoswipe-dynamic-caption-plugin/photoswipe-dynamic-caption-plugin.css">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <meta name="viewport" content="width=device-width">
        <style>
            body {
                margin: 0;
                padding: 0;
                font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;
                font-size: 14px;
                line-height: 20px;
                background: #eee;
            }
            h1 {
                margin: 0;
                padding: 50px 50px 30px 50px;
                font-size: 26px;
                line-height: 1.3;
            }
            .pswp-gallery__item {
                margin: 0 4px 4px 0;
            }
            .pswp-gallery__item img {
                display: block;
            }
            .pswp-gallery {
                max-width: 650px;
                padding: 0 50px 50px;
                background: #eee;
                position: relative;
                display: flex;
                flex-wrap: wrap;
            }
            .pswp__dynamic-caption {
                color: #fff;
                width: 100%;
            }
            .pswp__dynamic-caption a {
                color: #fff;
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="pswp-gallery" id="gallery">
            <!-- Images will be loaded dynamically -->
        </div>
        <script type="module">
            import PhotoSwipeLightbox from 'https://cdn.jsdelivr.net/npm/photoswipe@5.3.0/dist/photoswipe-lightbox.esm.js';
            import PhotoSwipeDynamicCaption from 'https://unpkg.com/photoswipe-dynamic-caption-plugin@1.2.7/photoswipe-dynamic-caption-plugin.esm.js';

            async function loadImages() {
                try {
                    const response = await fetch('/image_locations.json');
                    const imageData = await response.json();
                    const gallery = document.getElementById('gallery');
                    
                    Object.entries(imageData).reverse().filter(([filename, metadata]) => !filename.startsWith("attachments/")).forEach(([filename, metadata]) => {
                        const item = document.createElement('div');
                        item.className = 'pswp-gallery__item';
                        
                        const width = metadata.Width || 800;
                        const height = metadata.Height || 600;
                        
                        item.innerHTML = `
                            <a href="/${filename}" data-pswp-width="${width}" data-pswp-height="${height}" target="_blank">
                                <img src="/${filename}" alt="${filename}" style="max-width: 200px; height: auto;">
                            </a>
                            <div class="pswp-caption-content">
                                <b>${filename}</b><br>
                                <a href="/htmlTemplates/statusIndex?centerPoint=${metadata.Latitude.toFixed(6)}_${metadata.Longitude.toFixed(6)}">
                                    ${metadata.Latitude ? `Lat: ${metadata.Latitude.toFixed(6)}, Lng: ${metadata.Longitude.toFixed(6)}` : ''}
                                </a>
                                <br/>
                                ${metadata.Description}
                            </div>
                        `;
                        
                        gallery.appendChild(item);
                    });
                    
                    initPhotoSwipe();
                } catch (error) {
                    console.error('Error loading images:', error);
                }
            }

            function initPhotoSwipe() {
                const smallScreenPadding = {
                    top: 0, bottom: 0, left: 0, right: 0
                };
                const largeScreenPadding = {
                    top: 30, bottom: 30, left: 0, right: 0
                };
                const lightbox = new PhotoSwipeLightbox({
                    gallerySelector: '#gallery',
                    childSelector: '.pswp-gallery__item',
                    
                    paddingFn: (viewportSize) => {
                        return viewportSize.x < 700 ? smallScreenPadding : largeScreenPadding
                    },
                    pswpModule: () => import('https://cdn.jsdelivr.net/npm/photoswipe@5.3.0/dist/photoswipe.esm.js')
                });

                const captionPlugin = new PhotoSwipeDynamicCaption(lightbox, {
                    mobileLayoutBreakpoint: 700,
                    type: 'auto',
                    mobileCaptionOverlapRatio: 1
                });

                lightbox.init();
            }

            loadImages();
        </script>
    </body>
</html>
