<html>
    <head>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    </head>
    <body style="height: 100%;">
         <div id="status"></div>
         <div id="map" style="height: 100%; width: 100%;"></div>
         <script>
            function getDateString(dateTimeString) {
                const date = new Date(dateTimeString);
                const month = (date.getMonth()+1).toString().padStart(2, '0');
                const day = date.getDate().toString().padStart(2, '0');
                return `${date.getFullYear()}-${month}-${day}`;
            }
            async function getLatestStatus() {
                const payload = await fetch("/status/latest.json");
                return payload.json();
            }
            async function getPath(trailPath) {
                const payload = await fetch(trailPath);
                return payload.json();
            }
            async function getImageMap() {
                const payload = await fetch("/image_locations.json");
                return payload.json();
            }
            function resolveCenterPoint(statusCenterPoint, activePath) {
                if (activePath && activePath.length > 0) {
                    return activePath[activePath.length - 1].loc;
                } else {
                    return statusCenterPoint;
                }
            }
            async function drawMap(centerPoint, shelterPath, imageMap, activePath) {
                console.log(activePath);
                const resolvedCenterPoint = resolveCenterPoint(centerPoint, activePath);
                const map = L.map('map').setView(resolvedCenterPoint, 15);

                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }).addTo(map);
                var snowIcon = L.icon({iconUrl: '/attachments/icon_map.png', iconSize: [50, 50]});


                if (shelterPath) {
                    L.polyline(shelterPath.map(x=>x.loc)).addTo(map);
                    shelterPath.forEach(point => {
                        const marker = L.marker(point.loc, {opacity:0.8}).addTo(map);
                        marker.bindPopup(`<b>${point.label}</b><br/>ETA:${point.eta}, Mile:${point.miles}`);
                    });
                }

                if (activePath) {
                    console.log(activePath);
                    L.polyline(activePath.map(x=>x.loc), {color: 'yellow'}).addTo(map);
                    activePath.forEach(point => {
                        const marker = L.marker(point.loc, {icon: snowIcon}).addTo(map);
                        marker.bindPopup(`<b>${point.label}</b><br/>${point.note || ""}`);
                    });
                } else {
                    const marker = L.marker(resolvedCenterPoint, {icon: snowIcon}).addTo(map);
                    marker.bindPopup(`Lat: ${resolvedCenterPoint[0]}<br/> Long: ${resolvedCenterPoint[1]}`);
                }

                if (imageMap) {
                    Object.keys(imageMap).filter(key => !key.startsWith("attachments")).forEach(key => {
                        const cameraIcon = L.icon({iconUrl: '/attachments/camera_icon.png', iconSize: [30, 30]});
                        const point = [imageMap[key].Latitude, imageMap[key].Longitude];
                        const marker = L.marker(point, {icon: cameraIcon}).addTo(map);
                        marker.bindPopup(`<a href="/${key}" target="_blank" rel="noopener noreferrer"><img src="/${key}" style="max-width:100px" /></a><br/>${imageMap[key].Description || ""}`, 
                        {minWidth:100});
                    });
                }
            }
            async function updateStatus(trailPath, activePathLocation, endDate, centerPointParam) {
                const statusPromise = getLatestStatus();
                const shelterPathPromise = getPath(trailPath);
                const imageMapPromise = getImageMap();
                const activePath = activePathLocation ? (await getPath(activePathLocation)) : undefined;
                const filteredPath = activePath ? activePath.path.filter(point => endDate == undefined || getDateString(point.label) <= endDate) : undefined;

                const status = await statusPromise;
                const shelterPath = await shelterPathPromise;
                const imageMap = await imageMapPromise;

                const centerPoint = centerPointParam ? centerPointParam.split("_") : status.loc;

                await drawMap(centerPoint, shelterPath.path, imageMap, filteredPath, endDate);
            }

            const urlParams = new URLSearchParams(window.location.search);
            const trailPathParam = (urlParams.get("trailPath") || "shelterPath");
            const trailPath = `/paths/${trailPathParam}.json`;
            const activePathParam = urlParams.get("activePath");
            const activePath = activePathParam ? `/paths/${activePathParam}.json` : undefined;
            const endDate = urlParams.get("endDate");
            const centerPoint = urlParams.get("centerPoint");

            updateStatus(trailPath, activePath, endDate, centerPoint)
            .catch(error => {
                        document.body.innerHTML = `<p>Error loading path data: ${error}</p>`;
                        throw error;
                    });
         </script>
    </body>
</html>
